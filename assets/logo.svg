<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">EFCF Canada logo</title>
  <desc id="desc">Golden circular emblem with Egyptian film festival eye motif and maple leaf.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f9e7a6"/>
      <stop offset="18%" stop-color="#f0c24d"/>
      <stop offset="42%" stop-color="#d89b17"/>
      <stop offset="58%" stop-color="#f6d98f"/>
      <stop offset="75%" stop-color="#b7770f"/>
      <stop offset="100%" stop-color="#f4d87a"/>
    </linearGradient>
    <linearGradient id="deepGold" x1="0" x2="1">
      <stop offset="0%" stop-color="#8a5d0d"/>
      <stop offset="50%" stop-color="#f7d77b"/>
      <stop offset="100%" stop-color="#8a5d0d"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f6d97b"/>
      <stop offset="35%" stop-color="#d99d1a"/>
      <stop offset="72%" stop-color="#7c4d09"/>
      <stop offset="100%" stop-color="#2a1606"/>
    </radialGradient>
    <style>
      .ringtxt { font: 700 22px 'Georgia', 'Times New Roman', serif; letter-spacing: 3px; fill: #f5d373; }
      .ringtxtSmall { font: 700 15px 'Georgia', 'Times New Roman', serif; letter-spacing: 2.5px; fill: #f9d76e; }
      .goldStroke { stroke: url(#gold); stroke-width: 10; fill: none; }
      .goldStrokeThin { stroke: url(#deepGold); stroke-width: 5; fill: none; }
      .goldFill { fill: url(#gold); }
      .goldFillDeep { fill: url(#deepGold); }
      .navy { fill: #08172f; }
      .darkgold { fill: #553300; }
    </style>
    <path id="ringPathTop" d="M 260 50 A 210 210 0 1 1 259.9 50"/>
    <path id="ringPathBottom" d="M 260 470 A 210 210 0 1 1 259.9 470"/>
  </defs>

  <g transform="translate(10 10)">
    <circle cx="250" cy="250" r="236" fill="#08172f" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="250" cy="250" r="214" fill="none" stroke="url(#deepGold)" stroke-width="2" opacity="0.8"/>

    <g>
      <text class="ringtxt" textLength="1040" lengthAdjust="spacingAndGlyphs">
        <textPath href="#ringPathTop" startOffset="50%" text-anchor="middle">EGYPTIAN FILM AND CINEMA FESTIVAL</textPath>
      </text>
      <text class="ringtxtSmall" textLength="980" lengthAdjust="spacingAndGlyphs">
        <textPath href="#ringPathBottom" startOffset="50%" text-anchor="middle">EFCF CANADA</textPath>
      </text>
    </g>

    <g>
      <path d="M135 252 C150 158, 215 110, 250 108 C286 110, 350 160, 365 252 C352 343, 287 392, 250 399 C214 392, 147 344, 135 252 z" fill="url(#eyeGlow)" opacity="0.92"/>
      <path d="M135 250 C170 170, 205 140, 250 141 C294 140, 330 171, 365 250 C330 329, 294 361, 250 360 C206 361, 170 328, 135 250 z" fill="none" stroke="url(#gold)" stroke-width="12"/>
      <path d="M145 250 C169 193, 211 170, 250 170 C290 170, 330 194, 355 250 C331 307, 289 332, 250 332 C211 332, 170 307, 145 250 z" fill="#0a1028" opacity="0.7"/>
      <path d="M178 250 C203 205, 220 190, 250 191 C280 190, 298 204, 322 250 C298 296, 280 312, 250 313 C220 312, 204 296, 178 250 z" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.8"/>

      <g transform="translate(250 250)">
        <path d="M0 -30 L12 -9 L31 -12 L18 8 L21 30 L0 18 L-21 30 L-18 8 L-31 -12 L-12 -9 Z" fill="#bf0d14" stroke="#7d0a0d" stroke-width="3"/>
      </g>
    </g>

    <g transform="translate(250 250)">
      <path d="M-150 8 C-95 50, -55 90, 0 120 C56 90, 90 56, 150 12" class="goldStroke" stroke-linecap="round"/>
      <path d="M-150 12 C-98 51, -65 80, 0 105 C69 80, 100 50, 150 10" class="goldStrokeThin" stroke-linecap="round"/>
      <path d="M-40 28 C-55 92, -32 144, 0 170 C36 142, 50 90, 42 30" class="goldStroke" stroke-linecap="round"/>
      <path d="M40 30 C48 90, 38 144, 0 170 C-32 142, -50 92, -42 28" class="goldStroke" stroke-linecap="round"/>
    </g>

    <g transform="translate(250 364)">
      <path d="M-112 28 C-72 78, -42 95, 0 118 C40 96, 74 78, 112 28" class="goldStroke" stroke-linecap="round"/>
      <path d="M-78 60 C-51 94, -29 102, 0 118 C28 102, 52 94, 79 59" class="goldStrokeThin" stroke-linecap="round"/>
    </g>

    <g opacity="0.9">
      <path d="M310 164 L350 172 L332 210 L370 229 L328 237 L336 280 L299 248 L262 278 L273 235 L231 218 L274 205 L261 164 L299 188 Z" fill="url(#gold)" opacity="0.9"/>
      <path d="M185 354 L220 370 L204 402 L235 424 L199 432 L206 468 L174 440 L144 470 L151 434 L118 420 L156 406 L146 370 Z" fill="url(#gold)" opacity="0.75"/>
    </g>

    <g transform="translate(250 380)">
      <path d="M-70 20 C-52 -18, -28 -48, 0 -62 C30 -48, 54 -18, 72 20 C62 52, 44 80, 0 110 C-46 80, -64 50, -70 20 Z" fill="url(#gold)" opacity="0.9"/>
      <path d="M-96 28 C-80 14, -66 12, -55 24 C-61 54, -71 78, -98 82 C-103 58, -104 38, -96 28 Z" fill="url(#gold)" opacity="0.7"/>
      <path d="M95 28 C81 14, 67 12, 56 24 C60 54, 71 78, 97 82 C103 58, 104 38, 95 28 Z" fill="url(#gold)" opacity="0.7"/>
    </g>
  </g>
</svg>
